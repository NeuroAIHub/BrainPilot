# BrainPilot — single-user deployment: 1 main + 1 fixed sandbox (static), bridge net.
# Override the network with: docker compose -f docker-compose.yml -f docker-compose.host.yml up
services:
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
      # Default to the CPU stage. The sandbox Dockerfile is multi-stage and its
      # last stage is `gpu`; a targetless build would therefore install the much
      # larger GPU environment. GPU users opt in via docker-compose.gpu.yml.
      target: cpu
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        APT_MIRROR: ${APT_MIRROR:-}
    # Set BP_SANDBOX_IMAGE to use an official GHCR/ACR image without retagging.
    image: ${BP_SANDBOX_IMAGE:-brainpilot-sandbox:latest}
    environment:
      - PORT=${BP_SANDBOX_PORT:-8081}
      - AGENT_RUNTIME_PORT=${BP_SANDBOX_PORT:-8081}
      - BP_DATA_DIR=/root/.bp-root
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_CONTEXT_WINDOW=${ANTHROPIC_CONTEXT_WINDOW:-}
      - ANTHROPIC_MAX_TOKENS=${ANTHROPIC_MAX_TOKENS:-}
      - BP_MODELS_JSON=${BP_MODELS_JSON:-}
      - BP_MODEL_PROVIDER=${BP_MODEL_PROVIDER:-}
      - BP_MOCK=${BP_MOCK:-}
    volumes:
      # The whole data root is persisted here. Besides per-session
      # `workspaces/<sid>/`, this holds the cross-session persistent library
      # at `data/` (#257, flattened by #287) — uploads/datasets placed there
      # stay reusable across sessions. The runtime is single-user by contract;
      # multi-user hosting gives each user their own dataRoot / bind mount
      # (BP_USER_ID is no longer used for path resolution).
      - ${BP_DATA_DIR:-./brainpilot}:/root/.bp-root:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BP_SANDBOX_PORT:-8081}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  main:
    build:
      context: .
      dockerfile: docker/main/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        APT_MIRROR: ${APT_MIRROR:-}
        VITE_KB_SETTINGS_ENABLED: ${VITE_KB_SETTINGS_ENABLED:-1}
    image: brainpilot-main:latest
    depends_on:
      sandbox:
        condition: service_healthy
    ports:
      - "${BP_MAIN_PORT:-9001}:${BP_MAIN_PORT:-9001}"
    environment:
      - PORT=${BP_MAIN_PORT:-9001}
      # static mode is selected by BP_RUNTIME_URL being set (points main at the fixed sandbox runtime)
      - BP_RUNTIME_URL=http://sandbox:${BP_SANDBOX_PORT:-8081}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_CONTEXT_WINDOW=${ANTHROPIC_CONTEXT_WINDOW:-}
      - ANTHROPIC_MAX_TOKENS=${ANTHROPIC_MAX_TOKENS:-}
      - BP_MODELS_JSON=${BP_MODELS_JSON:-}
      - BP_MODEL_PROVIDER=${BP_MODEL_PROVIDER:-}
      - BP_MOCK=${BP_MOCK:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BP_MAIN_PORT:-9001}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
