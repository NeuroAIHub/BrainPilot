name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run '...'
        2. Open '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - npm (brainpilot up)
        - Docker (docker compose)
        - From source (npm run bp)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BrainPilot / @brainpilot/app version
      placeholder: e.g. 0.0.6 (run `brainpilot --version`)

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. v22.11.0 (run `node --version`)

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 14.2, Windows 11, Ubuntu 22.04

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste any error messages or logs (`brainpilot logs`, add `--runtime` for the runtime log), or attach screenshots.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful (custom model/gateway, MCP servers configured, etc.).
