name: CI

# 快速门禁（零 token）：typecheck + 单测 + 构建。
# 对应 README「Testing」的本地命令，搬到 PR/push 自动跑。
# 真实会话 / 烧 token 的黑盒回归不在此 —— 那由独立测试床流水线负责。

on:
  push:
    branches: [main, testbed]
  pull_request:
    branches: [main, testbed]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 注：当前 lockfile 与 package.json 不同步（见 issue：CLI 改名后未重生成），
      # `npm ci` 会失败。修复并提交 package-lock.json 后此步转绿。
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (non-web, deterministic mock)
        env:
          BP_MOCK: "1"
        run: npm test

      - name: Web tests + build
        working-directory: packages/web
        run: |
          npm test
          npm run build

      - name: Docs checks
        run: |
          npm run docs:check
          npm run docs:build

      - name: Build all packages
        run: npm run build

  # 黑盒测试可在 GitHub runner 跑的部分（零 token、不需真实 provider/宿主权限）。
  # 仅 testbed 分支有 testbed/ 目录；main 无此目录，job 自动跳过（if 守卫）。
  # 完整黑盒回归（recovery 需 kill 进程、cases/mcp 需真实 provider）由服务器 run-all.sh 跑。
  blackbox-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect testbed assets
        id: detect
        run: |
          if [ -d testbed/suites ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Build (cli + runtime + backend for brainpilot up)
        if: steps.detect.outputs.present == 'true'
        run: npm run build

      - name: demo-bundle 单测（纯函数，零依赖）
        if: steps.detect.outputs.present == 'true'
        run: node testbed/suites/demo-bundle.test.mjs

      - name: probes 单测（质量探针，纯函数，零依赖）
        if: steps.detect.outputs.present == 'true'
        run: node testbed/suites/probes.test.mjs

      - name: crossplatform 单测（Windows 路径/EOL 回归，纯函数）
        if: steps.detect.outputs.present == 'true'
        run: node testbed/suites/crossplatform.test.mjs

      - name: 起 mock 实例 + 跑 contract/scenarios（零 token）
        if: steps.detect.outputs.present == 'true'
        env:
          BP_MOCK: "1"
          ANTHROPIC_API_KEY: sk-mock-dummy
        run: |
          set -e
          DATA="$RUNNER_TEMP/bp-mock"
          node packages/cli/dist/bin.js up --dir "$DATA" --port 19020 --no-open --detach
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19020/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:19020/api/health
          cd testbed/suites
          node contract.mjs --base-url http://127.0.0.1:19020/api
          node run-scenarios.mjs --base-url http://127.0.0.1:19020/api --data-dir "$DATA"
          node web-journeys.mjs --base-url http://127.0.0.1:19020/api
